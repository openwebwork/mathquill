<!doctype html>

	<head>
		<title>MathQuill Inputs Test</title>

		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="icon" href="data:;base64,iVBORw0KGgo=">
		<script>
			if (window.matchMedia('(prefers-color-scheme: dark)').matches)
				document.documentElement.dataset.bsTheme = 'dark';
			window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
				if (window.matchMedia('(prefers-color-scheme: dark)').matches)
					document.documentElement.dataset.bsTheme = 'dark';
				else document.documentElement.dataset.bsTheme = 'light';
			});
		</script>
		<link href="/bootstrap/css/bootstrap.min.css" rel="stylesheet">
		<link rel="stylesheet" href="mathquill.css">
		<link rel="stylesheet" href="input-test.css">
		<script src="/bootstrap/js/bootstrap.bundle.min.js" defer></script>
		<script src="mathquill.js" defer></script>
		<script src="input-test.js" defer></script>
	</head>
	<body>
		<main class="container-fluid">
			<div class="rule-container">
				<input id="AnSwEr0001" type="text">
				<span id="mq-answer-AnSwEr0001"></span>
				<input id="MaThQuIlL_AnSwEr0001" type="text" value="">
			</div>
			<div class="options-container"></div>
		</main>
	</body>
</html>
